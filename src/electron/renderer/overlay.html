<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MTGA Tracker Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="drag-handle" class="drag-handle" title="Drag to move (Cmd/Ctrl+Shift+O to unlock)"></div>
    <div id="panel" class="panel">
      <div id="status" class="status">Starting...</div>

      <div id="match" class="match hidden">
        <div class="players">
          <div class="player me">
            <div class="name" id="me-name">You</div>
            <div class="life" id="me-life">-</div>
          </div>
          <div class="vs">vs</div>
          <div class="player opp">
            <div class="name" id="opp-name">Opponent</div>
            <div class="life" id="opp-life">-</div>
          </div>
        </div>
        <div class="turn" id="turn-indicator"></div>
        <div class="outcome hidden" id="outcome"></div>
      </div>

      <div id="draft-progress" class="draft-progress hidden" title="Click to view live draft progress (unlock the overlay first - Cmd/Ctrl+Shift+O)">
        <span class="draft-pack-pick" id="draft-pack-pick"></span>
        <span class="draft-picked" id="draft-picked"></span>
      </div>

      <!-- Milestone 23: the expanded draft board - every pack seen so far
           (last-seen state), which cards were picked from each, and colors
           taken. Only shown (and the window only grown to make room for it -
           see electron/main.ts's setOverlayDraftExpanded) while a draft is
           actually in progress. Its content is a pre-rendered, trusted HTML
           fragment pushed from the main process (draftBoardFragmentHtml in
           draftProgressHtml.ts) - see overlay-renderer.js's render() for why
           innerHTML is safe here. -->
      <div id="draft-board" class="draft-board hidden"></div>

      <div id="event-record" class="event-record hidden" title="Click to view this event's deck (unlock the overlay first - Cmd/Ctrl+Shift+O)">
        <span class="event-name" id="event-name"></span>
        <span class="event-wl" id="event-wl"></span>
      </div>
    </div>
    <script src="overlay-renderer.js"></script>
  </body>
</html>
